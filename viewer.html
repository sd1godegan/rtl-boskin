<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer Slide — SD Negeri 1 Godegan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #e2e8f0;
    --header-bg: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --blue: #2563eb;
    --blue-soft: #dbeafe;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
  }

  /* ==== STAGE (area PDF) ==== */
  #stage {
    position: fixed;
    inset: 0;
    padding-top: 58px; /* ruang untuk header */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    display: block;
    box-shadow: 0 6px 28px rgba(15,23,42,0.18);
    background: #ffffff;
    border-radius: 3px;
  }

  /* ==== HEADER (auto-hide) ==== */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 58px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 30;
    transition: opacity 0.35s ease, transform 0.35s ease;
    box-shadow: 0 2px 10px -6px rgba(15,23,42,0.12);
  }
  header.hidden {
    opacity: 0;
    transform: translateY(-100%);
    pointer-events: none;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
    flex: 1;
  }

  .back-btn {
    color: var(--text);
    text-decoration: none;
    font-size: 18px;
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: #f1f5f9;
    transition: background 0.2s ease, color 0.2s ease;
    flex-shrink: 0;
    font-weight: 700;
  }
  .back-btn:hover {
    background: var(--blue-soft);
    color: var(--blue);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }

  .brand-mark {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--blue);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }

  .brand-text {
    min-width: 0;
    flex: 1;
  }
  .brand-title {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.3;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }

  .header-right {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .header-btn {
    color: var(--text);
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 9px;
    background: #f1f5f9;
    transition: background 0.2s ease, color 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .header-btn:hover {
    background: var(--blue-soft);
    color: var(--blue);
  }
  .header-btn svg {
    width: 14px;
    height: 14px;
  }

  /* ==== NAV BUTTONS (kiri/kanan, transparan, auto-hide) ==== */
  .nav-btn {
    position: fixed;
    top: 58px; bottom: 0;
    width: 14vw;
    max-width: 130px;
    min-width: 70px;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(15,23,42,0.35);
    font-size: 48px;
    font-weight: 300;
    line-height: 1;
    transition: opacity 0.35s ease, color 0.25s ease, background 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn.prev { left: 0; }
  .nav-btn.next { right: 0; }

  .nav-btn:hover:not(:disabled) {
    color: var(--blue);
  }
  .nav-btn.prev:hover:not(:disabled) {
    background: linear-gradient(to right, rgba(37,99,235,0.08), transparent);
  }
  .nav-btn.next:hover:not(:disabled) {
    background: linear-gradient(to left, rgba(37,99,235,0.08), transparent);
  }
  .nav-btn:disabled {
    opacity: 0.15;
    cursor: default;
  }

  /* Saat UI disembunyikan */
  body.ui-hidden .nav-btn { opacity: 0; pointer-events: none; }
  body.ui-hidden #page-indicator { opacity: 0; pointer-events: none; }

  /* ==== PAGE INDICATOR ==== */
  #page-indicator {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    color: var(--text);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    z-index: 30;
    transition: opacity 0.35s ease;
    border: 1px solid var(--line);
    box-shadow: 0 4px 14px -6px rgba(15,23,42,0.15);
  }
  #page-indicator .sep {
    color: var(--muted);
    margin: 0 4px;
    font-weight: 500;
  }

  /* ==== LOADING / ERROR ==== */
  #loading, #error {
    position: absolute;
    text-align: center;
    padding: 40px;
    font-size: 13.5px;
    color: var(--muted);
    font-weight: 500;
  }
  #error { color: #dc2626; }

  .spinner {
    width: 34px; height: 34px;
    border: 3px solid #cbd5e1;
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ==== MOBILE ==== */
  @media (max-width: 600px) {
    header { height: 54px; padding: 0 14px; }
    #stage { padding-top: 54px; }
    .nav-btn { top: 54px; font-size: 34px; width: 22vw; }
    .brand-mark { width: 34px; height: 34px; font-size: 12px; }
    .brand-title { font-size: 12.5px; }
    .brand-sub { font-size: 10px; }
    .header-btn { font-size: 11px; padding: 7px 10px; }
    .header-btn .label { display: none; }
    #page-indicator { font-size: 11.5px; padding: 6px 14px; bottom: 16px; }
  }
</style>
</head>
<body>

<header id="header">
  <div class="header-left">
    <a href="index.html" class="back-btn" title="Kembali">←</a>
    <div class="brand">
      <div class="brand-mark">SD1</div>
      <div class="brand-text">
        <div class="brand-title">SD Negeri 1 Godegan</div>
        <div class="brand-sub" id="file-name">Memuat…</div>
      </div>
    </div>
  </div>
  <div class="header-right">
    <a id="download-link" href="#" download class="header-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/>
        <path d="m7 10 5 5 5-5"/>
        <path d="M5 21h14"/>
      </svg>
      <span class="label">Unduh</span>
    </a>
  </div>
</header>

<div id="stage">
  <div id="loading">
    <div class="spinner"></div>
    Memuat slide…
  </div>
  <canvas id="pdf-canvas" style="display:none;"></canvas>
  <div id="error" style="display:none;"></div>
</div>

<button class="nav-btn prev" id="prev-btn" disabled aria-label="Sebelumnya">‹</button>
<button class="nav-btn next" id="next-btn" disabled aria-label="Berikutnya">›</button>

<div id="page-indicator">
  <span id="page-current">–</span><span class="sep">/</span><span id="page-total">–</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const params = new URLSearchParams(location.search);
  const file = params.get('file');

  const canvas     = document.getElementById('pdf-canvas');
  const ctx        = canvas.getContext('2d');
  const loading    = document.getElementById('loading');
  const errorEl    = document.getElementById('error');
  const pageCur    = document.getElementById('page-current');
  const pageTot    = document.getElementById('page-total');
  const prevBtn    = document.getElementById('prev-btn');
  const nextBtn    = document.getElementById('next-btn');
  const fileNameEl = document.getElementById('file-name');
  const dlLink     = document.getElementById('download-link');
  const header     = document.getElementById('header');

  let pdfDoc = null;
  let pageNum = 1;
  let rendering = false;
  let pendingPage = null;

  /* ==== AUTO-HIDE UI ==== */
  let hideTimer;
  const HIDE_DELAY = 3000;

  function showUI() {
    document.body.classList.remove('ui-hidden');
    header.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideUI, HIDE_DELAY);
  }
  function hideUI() {
    document.body.classList.add('ui-hidden');
    header.classList.add('hidden');
  }

  ['mousemove', 'mousedown', 'touchstart', 'keydown', 'scroll', 'wheel']
    .forEach(ev => document.addEventListener(ev, showUI, { passive: true }));

  /* ==== LOAD PDF ==== */
  if (!file) {
    loading.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Parameter file tidak ditemukan. Silakan kembali ke halaman utama.';
    showUI();
  } else {
    const cleanName = decodeURIComponent(file).split('/').pop();
    // Bersihkan nama file untuk subtitle (buang .pdf, ganti - jadi spasi)
    const prettyName = cleanName
      .replace(/\.pdf$/i, '')
      .replace(/[-_]/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());

    fileNameEl.textContent = prettyName;
    dlLink.href = file;
    dlLink.setAttribute('download', cleanName);
    loadPdf(file);
    showUI();
  }

  async function loadPdf(url) {
    try {
      pdfDoc = await pdfjsLib.getDocument(url).promise;
      loading.style.display = 'none';
      canvas.style.display = 'block';
      prevBtn.disabled = false;
      nextBtn.disabled = false;
      pageTot.textContent = pdfDoc.numPages;
      renderPage(pageNum);
    } catch (err) {
      console.error(err);
      loading.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.textContent = 'Gagal memuat PDF. Pastikan file tersedia di repositori.';
    }
  }

  /* ==== RENDER HALAMAN ==== */
  async function renderPage(num) {
    if (rendering) { pendingPage = num; return; }
    rendering = true;
    try {
      const page = await pdfDoc.getPage(num);
      const base = page.getViewport({ scale: 1 });

      const padding = window.innerWidth < 700 ? 14 : 36;
      const headerH = window.innerWidth < 600 ? 54 : 58;
      const maxW = window.innerWidth  - padding * 2;
      const maxH = window.innerHeight - padding * 2 - headerH;

      const scale = Math.min(maxW / base.width, maxH / base.height);
      const viewport = page.getViewport({ scale });

      const dpr = window.devicePixelRatio || 1;
      canvas.width  = Math.floor(viewport.width  * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width  = Math.floor(viewport.width)  + 'px';
      canvas.style.height = Math.floor(viewport.height) + 'px';

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, viewport.width, viewport.height);

      await page.render({ canvasContext: ctx, viewport }).promise;

      pageCur.textContent = num;
      prevBtn.disabled = num <= 1;
      nextBtn.disabled = num >= pdfDoc.numPages;
    } catch (e) {
      console.error(e);
    }
    rendering = false;
    if (pendingPage !== null) {
      const p = pendingPage; pendingPage = null;
      renderPage(p);
    }
  }

  /* ==== NAVIGASI ==== */
  function goPrev() { if (pdfDoc && pageNum > 1) { pageNum--; renderPage(pageNum); } }
  function goNext() { if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; renderPage(pageNum); } }

  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   goPrev();
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') goNext();
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.();
    }
  }

  /* ==== RESIZE ==== */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (pdfDoc) renderPage(pageNum); }, 200);
  });

  /* ==== SWIPE (HP) ==== */
  let touchStartX = 0, touchStartY = 0;
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) goNext(); else goPrev();
    }
  }, { passive: true });
</script>
</body>
</html>
