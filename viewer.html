<!DOCTYPE html>
<html lang="id" data-tab="slide" data-ui="visible" data-fullscreen="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer — SD Negeri 1 Godegan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CASCADE LAYERS
   ============================================================ */
@layer reset, tokens, base, layout, components, motion;

/* ============================================================
   RESET
   ============================================================ */
@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scrollbar-width: none;
    block-size: 100%;
    overflow: hidden;
  }
  html::-webkit-scrollbar { display: none; }

  body {
    block-size: 100%;
    min-block-size: 100dvh;
    font-family: var(--font-sans, system-ui, sans-serif);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    overflow: hidden;
    user-select: none;
  }

  body[data-tab="rtl"] { user-select: auto; }

  img, svg { display: block; max-inline-size: 100%; }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }

  button:focus, a:focus { outline: 0; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: var(--radius-sm);
  }

  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  iframe { border: 0; display: block; }

  [hidden] { display: none !important; }

  :where(h1, h2, h3, h4) {
    line-height: 1.15;
    text-wrap: balance;
  }
  :where(p) { text-wrap: pretty; }

  ::selection {
    background: color-mix(in oklab, var(--accent) 30%, transparent);
    color: var(--text);
  }
}

/* ============================================================
   TOKENS
   ============================================================ */
@layer tokens {
  :root {
    /* Accent — di-override oleh JS dari dataset.accent */
    --accent: #2563eb;
    --accent-ink: color-mix(in oklab, var(--accent) 90%, black);
    --accent-soft: color-mix(in oklab, var(--accent) 12%, white);

    /* Surfaces */
    --surface: #ffffff;
    --surface-page: #e2e8f0;
    --surface-soft: #f1f5f9;

    /* Text */
    --text: #0f172a;
    --text-muted: #64748b;
    --text-faint: #94a3b8;

    /* Border */
    --border: #e2e8f0;
    --border-strong: #cbd5e1;

    /* Semantic */
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warning: #f59e0b;
    --pink: #ec4899;

    /* Spacing */
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.25rem;
    --space-6: 1.5rem;
    --space-8: 2rem;

    /* Radius */
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-2xl: 20px;
    --radius-pill: 999px;

    /* Shadow */
    --shadow-1: 0 1px 2px rgb(15 23 42 / 0.04);
    --shadow-2: 0 4px 16px -8px rgb(15 23 42 / 0.10);
    --shadow-3: 0 12px 32px -12px rgb(15 23 42 / 0.18);
    --shadow-4: 0 24px 60px -20px rgb(15 23 42 / 0.5);

    /* Motion */
    --ease-out: cubic-bezier(.2, .8, .2, 1);
    --dur-fast: 150ms;
    --dur-normal: 250ms;
    --dur-slow: 400ms;

    /* Chrome */
    --header-h: 58px;
    --tabs-h: 52px;

    /* Font */
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

    /* Typography scale */
    --text-xs: 10.5px;
    --text-sm: 12px;
    --text-base: 13px;
    --text-md: 14px;
    --text-lg: 15px;
    --text-xl: 17px;
    --text-2xl: 20px;
  }

  @media (max-width: 600px) {
    :root {
      --header-h: 54px;
      --tabs-h: 48px;
    }
  }
}

/* ============================================================
   BASE
   ============================================================ */
@layer base {
  body {
    background: var(--surface-page);
    color: var(--text);
  }

  html[data-fullscreen="true"],
  html[data-fullscreen="true"] body {
    background: #000;
  }
}

/* ============================================================
   LAYOUT
   ============================================================ */
@layer layout {
  .app {
    display: flex;
    flex-direction: column;
    block-size: 100dvh;
    overflow: hidden;
  }

  /* Topbar */
  .topbar {
    position: relative;
    z-index: 40;
    flex-shrink: 0;
    block-size: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    padding-inline: var(--space-5);
    background: var(--surface);
    border-block-end: 1px solid var(--border);
    box-shadow: var(--shadow-1);
    transition:
      opacity var(--dur-normal) var(--ease-out),
      transform var(--dur-normal) var(--ease-out);
    backface-visibility: hidden;
    will-change: opacity, transform;
  }

  .topbar__group {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-inline-size: 0;
  }
  .topbar__group--start { flex: 1; }

  /* Tabbar */
  .tabbar {
    position: relative;
    z-index: 35;
    flex-shrink: 0;
    block-size: var(--tabs-h);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    padding-inline: var(--space-5);
    background: var(--surface);
    border-block-end: 1px solid var(--border);
    transition:
      opacity var(--dur-normal) var(--ease-out),
      transform var(--dur-normal) var(--ease-out);
    backface-visibility: hidden;
    will-change: opacity, transform;
  }

  /* Hidden state */
  html[data-ui="hidden"] .topbar,
  html[data-ui="hidden"] .tabbar {
    opacity: 0;
    transform: translateY(-100%);
    pointer-events: none;
    border-block-end-color: transparent;
    box-shadow: none;
  }

  /* Fullscreen state */
  html[data-fullscreen="true"] .topbar,
  html[data-fullscreen="true"] .tabbar { display: none; }

  /* Main */
  .main {
    flex: 1;
    min-block-size: 0;
    position: relative;
    overflow: hidden;
  }

  /* Panels */
  .panel {
    position: absolute;
    inset: 0;
    display: none;
  }
  .panel[data-active="true"] { display: block; }
  .panel--slide[data-active="true"] { display: grid; place-items: center; }
  .panel--rtl[data-active="true"] { overflow-y: auto; overflow-x: hidden; }

  /* Slide panel fullscreen */
  html[data-fullscreen="true"] .panel--slide { padding: 0; }
}

/* ============================================================
   COMPONENTS
   ============================================================ */
@layer components {

  /* ---- Button ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: 8px 14px;
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    font-weight: 700;
    white-space: nowrap;
    letter-spacing: 0.1px;
    transition:
      background var(--dur-fast) ease,
      color var(--dur-fast) ease,
      filter var(--dur-fast) ease,
      transform var(--dur-fast) ease;
  }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled, .btn[aria-disabled="true"] {
    opacity: 0.45;
    pointer-events: none;
  }

  .btn--ghost {
    background: var(--surface-soft);
    color: var(--text);
  }
  .btn--ghost:hover {
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .btn--ghost[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent-ink);
  }

  .btn--primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px -4px var(--accent);
  }
  .btn--primary:hover { filter: brightness(0.92); }

  .btn__icon {
    inline-size: 14px;
    block-size: 14px;
    flex-shrink: 0;
  }

  @media (max-width: 600px) {
    .btn__label { display: none; }
    .btn { padding: 8px 10px; }
  }

  /* ---- Back button ---- */
  .back {
    flex-shrink: 0;
    inline-size: 36px;
    block-size: 36px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    font-size: 18px;
    font-weight: 700;
    transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
  }
  .back:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* ---- Brand ---- */
  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    flex: 1;
    min-inline-size: 0;
  }

  .brand__mark {
    flex-shrink: 0;
    inline-size: 38px;
    block-size: 38px;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: var(--text-md);
    font-weight: 800;
    letter-spacing: -0.5px;
    transition: background var(--dur-normal) ease;
  }

  .brand__text {
    flex: 1;
    min-inline-size: 0;
  }

  .brand__title {
    font-size: var(--text-lg);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand__sub {
    font-size: var(--text-sm);
    color: var(--text-muted);
    line-height: 1.3;
    margin-block-start: 2px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- Tab ---- */
  .tab {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    font-weight: 700;
    color: var(--text-muted);
    transition:
      background var(--dur-fast) ease,
      color var(--dur-fast) ease;
  }
  .tab:hover {
    background: var(--surface-soft);
    color: var(--text);
  }
  .tab[aria-selected="true"] {
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .tab__icon {
    inline-size: 15px;
    block-size: 15px;
  }

  /* ---- Viewer (slide panel) ---- */
  .viewer {
    position: relative;
    inline-size: 100%;
    block-size: 100%;
    display: grid;
    place-items: center;
    padding-block: 24px;
    padding-inline: clamp(14px, 3vw, 36px);
  }

  .viewer__canvas {
    max-inline-size: 100%;
    max-block-size: 100%;
    box-shadow: var(--shadow-3);
    background: #fff;
    border-radius: 3px;
    transition: border-radius var(--dur-normal) ease;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    backface-visibility: hidden;
  }

  html[data-fullscreen="true"] .viewer { padding: 0; }
  html[data-fullscreen="true"] .viewer__canvas {
    border-radius: 0;
    box-shadow: none;
  }

  .viewer__state {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px;
    font-size: var(--text-base);
    color: var(--text-muted);
    font-weight: 500;
  }
  .viewer__state--error { color: var(--danger); }
  html[data-fullscreen="true"] .viewer__state { color: #fff; }

  .viewer__nav {
    position: absolute;
    inset-block: 0;
    inset-inline-start: 0;
    inline-size: min(14vw, 130px);
    min-inline-size: 70px;
    display: grid;
    place-items: center;
    font-size: 48px;
    font-weight: 300;
    line-height: 1;
    color: color-mix(in oklab, var(--text) 35%, transparent);
    transition:
      color var(--dur-fast) ease,
      opacity var(--dur-normal) ease;
    z-index: 20;
    -webkit-tap-highlight-color: transparent;
  }
  .viewer__nav--next {
    inset-inline-start: auto;
    inset-inline-end: 0;
  }
  .viewer__nav:hover:not(:disabled) { color: var(--accent); }
  .viewer__nav:disabled { opacity: 0.15; cursor: default; }

  html[data-fullscreen="true"] .viewer__nav {
    color: color-mix(in oklab, #fff 55%, transparent);
    text-shadow: 0 2px 12px rgb(0 0 0 / 0.6);
  }
  html[data-fullscreen="true"] .viewer__nav:hover:not(:disabled) { color: #fff; }

  html[data-ui="hidden"] .viewer__nav {
    opacity: 0;
    pointer-events: none;
  }

  .viewer__indicator {
    position: absolute;
    inset-block-end: 22px;
    inset-inline-start: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    padding: 8px 18px;
    border-radius: var(--radius-pill);
    background: var(--surface);
    color: var(--text);
    font-size: var(--text-sm);
    font-weight: 700;
    letter-spacing: 0.3px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-2);
    font-variant-numeric: tabular-nums;
    z-index: 30;
    transition:
      opacity var(--dur-normal) ease,
      background var(--dur-normal) ease,
      color var(--dur-normal) ease;
  }
  .viewer__indicator-sep {
    color: var(--text-muted);
    margin-inline: 4px;
    font-weight: 500;
  }
  html[data-fullscreen="true"] .viewer__indicator {
    background: rgb(255 255 255 / 0.15);
    color: #fff;
    border-color: rgb(255 255 255 / 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: none;
  }
  html[data-fullscreen="true"] .viewer__indicator-sep {
    color: rgb(255 255 255 / 0.5);
  }
  html[data-ui="hidden"] .viewer__indicator {
    opacity: 0;
    pointer-events: none;
  }

  /* ---- Spinner ---- */
  .spinner {
    inline-size: 34px;
    block-size: 34px;
    border: 3px solid var(--border-strong);
    border-block-start-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  html[data-fullscreen="true"] .spinner {
    border-color: rgb(255 255 255 / 0.2);
    border-block-start-color: #fff;
  }
  .viewer__state .spinner {
    margin-inline: auto;
    margin-block-end: 14px;
  }

  /* ---- RTL Panel ---- */
  .rtl {
    max-inline-size: 1100px;
    margin-inline: auto;
    padding: clamp(24px, 4vh, 40px) var(--space-6);
    padding-block-end: 60px;
  }

  .rtl__header {
    text-align: center;
    margin-block-end: var(--space-8);
  }

  .rtl__title {
    font-size: var(--text-2xl);
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.2;
    margin-block-end: var(--space-2);
  }

  .rtl__subtitle {
    font-size: var(--text-base);
    color: var(--text-muted);
    line-height: 1.6;
    max-inline-size: 620px;
    margin-inline: auto;
    font-weight: 500;
  }

  .rtl__section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    overflow: hidden;
    margin-block-end: var(--space-5);
    box-shadow: var(--shadow-2);
  }

  .rtl__section-head {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-5);
    border-block-end: 1px solid var(--border);
    background: var(--surface-soft);
  }

  .rtl__section-num {
    flex-shrink: 0;
    inline-size: 36px;
    block-size: 36px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: #fff;
    font-size: var(--text-lg);
    font-weight: 800;
  }

  .rtl__section-title {
    flex: 1;
    min-inline-size: 0;
    font-size: var(--text-lg);
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .rtl__item {
    padding: var(--space-5) var(--space-6);
    border-block-end: 1px solid var(--border);
    transition: background var(--dur-fast) ease;
  }
  .rtl__item:last-child { border-block-end: 0; }
  .rtl__item:hover {
    background: color-mix(in oklab, var(--surface-soft) 50%, white);
  }

  .rtl__item-head {
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
    margin-block-end: var(--space-2);
  }

  .rtl__item-code {
    display: inline-grid;
    place-items: center;
    min-inline-size: 32px;
    block-size: 26px;
    padding-inline: var(--space-2);
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    font-weight: 800;
    flex-shrink: 0;
    letter-spacing: 0.3px;
  }

  .rtl__item-title {
    flex: 1;
    font-size: var(--text-lg);
    font-weight: 800;
    letter-spacing: -0.015em;
    line-height: 1.35;
  }

  .rtl__item-desc {
    font-size: var(--text-base);
    color: var(--text-muted);
    line-height: 1.65;
    margin-block-end: var(--space-4);
    font-weight: 500;
  }

  .rtl__meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: var(--space-4) var(--space-6);
    padding-block: var(--space-4);
    border-block: 1px solid var(--border);
    margin-block-end: var(--space-4);
  }

  .rtl__meta-label {
    font-size: var(--text-xs);
    font-weight: 800;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-block-end: 4px;
  }

  .rtl__meta-value {
    font-size: var(--text-base);
    font-weight: 600;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .rtl__meta-value--muted {
    color: var(--text-muted);
    font-weight: 500;
  }

  .rtl__files {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2);
  }

  .rtl__files-label {
    font-size: var(--text-xs);
    font-weight: 800;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-inline-end: var(--space-1);
  }

  /* ---- Doc button ---- */
  .doc-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 13px;
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    font-weight: 700;
    letter-spacing: 0.1px;
    color: #fff;
    background: var(--accent);
    box-shadow: 0 3px 8px -3px var(--accent);
    transition:
      filter var(--dur-fast) ease,
      transform var(--dur-fast) ease;
    cursor: pointer;
    font-family: inherit;
  }
  .doc-btn:hover { filter: brightness(0.92); }
  .doc-btn:active { transform: scale(0.97); }

  .doc-btn__icon {
    inline-size: 13px;
    block-size: 13px;
    flex-shrink: 0;
  }

  .doc-btn--produk {
    background: var(--warning);
    box-shadow: 0 3px 8px -3px var(--warning);
  }

  .doc-btn--external {
    background: var(--pink);
    box-shadow: 0 3px 8px -3px var(--pink);
  }

  .doc-btn--disabled {
    background: var(--surface-soft);
    color: var(--text-faint);
    box-shadow: none;
    cursor: not-allowed;
    pointer-events: none;
    font-weight: 600;
  }

  /* ---- Preview Modal ---- */
  .preview {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: var(--space-6);
  }
  .preview[data-open="true"] { display: flex; }

  .preview__backdrop {
    position: absolute;
    inset: 0;
    background: rgb(15 23 42 / 0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    animation: fade-in var(--dur-normal) ease;
  }

  .preview__dialog {
    position: relative;
    inline-size: 100%;
    max-inline-size: 980px;
    block-size: 88dvh;
    max-block-size: 800px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface);
    border-radius: var(--radius-2xl);
    box-shadow: var(--shadow-4);
    animation: pop-in var(--dur-normal) var(--ease-out);
  }

  .preview__head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    border-block-end: 1px solid var(--border);
  }

  .preview__icon {
    flex-shrink: 0;
    inline-size: 40px;
    block-size: 40px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-md);
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .preview__icon svg { inline-size: 20px; block-size: 20px; }

  .preview__meta {
    flex: 1;
    min-inline-size: 0;
  }

  .preview__title {
    font-size: var(--text-lg);
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .preview__sub {
    font-size: var(--text-sm);
    color: var(--text-muted);
    font-weight: 500;
    margin-block-start: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .preview__close {
    flex-shrink: 0;
    inline-size: 38px;
    block-size: 38px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    color: var(--text);
    font-size: 22px;
    font-weight: 400;
    line-height: 1;
    transition:
      background var(--dur-fast) ease,
      color var(--dur-fast) ease;
  }
  .preview__close:hover {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .preview__body {
    flex: 1;
    min-block-size: 0;
    position: relative;
    background: var(--surface-soft);
  }

  .preview__frame {
    inline-size: 100%;
    block-size: 100%;
    background: #fff;
  }

  .preview__loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px;
    background: var(--surface-soft);
    font-size: var(--text-base);
    color: var(--text-muted);
    font-weight: 500;
    transition: opacity var(--dur-normal) ease;
  }
  .preview__loading .spinner {
    margin-inline: auto;
    margin-block-end: var(--space-3);
  }

  .preview__foot {
    flex-shrink: 0;
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-5);
    border-block-start: 1px solid var(--border);
    background: var(--surface);
  }

  /* ---- Preview: mobile ---- */
  @media (max-width: 600px) {
    .preview { padding: 0; }
    .preview__dialog {
      max-inline-size: none;
      block-size: 100dvh;
      max-block-size: none;
      border-radius: 0;
    }
    .preview__head { padding: var(--space-3) var(--space-4); }
    .preview__icon { inline-size: 36px; block-size: 36px; }
    .preview__icon svg { inline-size: 18px; block-size: 18px; }
    .preview__title { font-size: var(--text-md); }
    .preview__close { inline-size: 34px; block-size: 34px; font-size: 20px; }
    .preview__foot { padding: var(--space-3) var(--space-4); }
    .preview__foot .btn { flex: 1; justify-content: center; }
  }

  /* ---- Responsive: tablet & mobile ---- */
  @media (max-width: 920px) and (min-width: 601px) {
    .rtl__meta { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 600px) {
    .brand__mark { inline-size: 34px; block-size: 34px; font-size: var(--text-sm); }
    .brand__title { font-size: var(--text-base); }
    .brand__sub { font-size: var(--text-xs); }
    .tab { padding: 7px 12px; gap: var(--space-2); }
    .tab__icon { inline-size: 14px; block-size: 14px; }
    .viewer__nav { font-size: 34px; inline-size: 22vw; }
    .viewer__indicator { font-size: var(--text-sm); padding: 6px 14px; inset-block-end: 16px; }

    .rtl { padding: var(--space-5) var(--space-4) 40px; }
    .rtl__header { margin-block-end: var(--space-6); }
    .rtl__title { font-size: var(--text-xl); }
    .rtl__subtitle { font-size: var(--text-sm); }
    .rtl__section-head { padding: var(--space-4); gap: var(--space-3); }
    .rtl__section-num { inline-size: 32px; block-size: 32px; font-size: var(--text-base); }
    .rtl__section-title { font-size: var(--text-md); }
    .rtl__item { padding: var(--space-4); }
    .rtl__item-title { font-size: var(--text-md); }
    .rtl__item-desc { font-size: var(--text-sm); margin-block-end: var(--space-3); }
    .rtl__meta {
      grid-template-columns: 1fr;
      gap: var(--space-3);
      padding-block: var(--space-3);
    }
    .rtl__meta-value { font-size: var(--text-sm); }
  }
}

/* ============================================================
   MOTION
   ============================================================ */
@layer motion {
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes pop-in {
    from { opacity: 0; transform: scale(0.96) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
}
</style>

<body>

<div class="app">

  <!-- ===== Topbar ===== -->
  <header class="topbar">
    <div class="topbar__group topbar__group--start">
      <a href="index.html" class="back" aria-label="Kembali ke beranda">←</a>
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">SD1</div>
        <div class="brand__text">
          <div class="brand__title">SD Negeri 1 Godegan</div>
          <div class="brand__sub" id="themeName">Memuat…</div>
        </div>

    <div class="topbar__group">
      <button id="fsBtn" class="btn btn--ghost" aria-pressed="false" aria-label="Toggle layar penuh">
        <svg id="fsIcon" class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>

          <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>

  <!-- ===== Tabbar ===== -->

    <button class="tab" data-tab="rtl" role="tab" aria-selected="false">
      <svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>

    </button>
  </nav>

  <!-- ===== Main ===== -->
  <main class="main">

    <!-- Panel: Slide -->

<!-- ===== Preview Modal ===== -->
<div class="preview" id="previewModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle">
  <div class="preview__backdrop" data-close></div>
  <div class="preview__dialog">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>

          <path d="M15 3h6v6"/>

        <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
  "use strict";

  /* ============================================================
     CONSTANTS
     ============================================================ */
  const AUTOHIDE_DELAY = 3000;
  const AUTOHIDE_DELAY_FS = 2000;
  const MODAL_LOAD_TIMEOUT = 5000;
  const SWIPE_THRESHOLD = 60;

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  /* ============================================================
     DOM HELPERS
     ============================================================ */
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const html = document.documentElement;

  /* ============================================================
     STATE
     ============================================================ */
  const state = {
    pdf: null,
    page: 1,
    rendering: false,
    pendingPage: null,
    tab: "slide",
    hideTimer: null,
    lastFocused: null,
  };

  const els = {};

  /* ============================================================
     ICONS
     ============================================================ */
  const ICON = {
    eye: `<svg class="doc-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
    doc: `<svg class="doc-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>`,
    link: `<svg class="doc-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
    alert: `<svg class="doc-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>`,
  };

  /* ============================================================
     UTILITIES
     ============================================================ */
  const escapeHtml = (str) =>
    String(str).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const isPdfLink = (url) => {
    if (!url?.trim()) return false;
    const s = url.toLowerCase();
    return s.endsWith(".pdf") || s.includes(".pdf?") || s.includes(".pdf#");
  };

  const isExternalLink = (url) =>
    /^https?:\/\//i.test(url?.trim() ?? "") && !isPdfLink(url);

  const nextTick = () => new Promise((r) => requestAnimationFrame(r));

  /* ============================================================
     DATA RESOLUTION
     ============================================================ */
  function resolveDataset() {
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const file = params.get("file");

    if (id && RTL_DATA[id]) return RTL_DATA[id];
    if (file) {
      for (const key in RTL_DATA) {
        if (RTL_DATA[key].slide === file) return RTL_DATA[key];
      }
    }
    return null;
  }

  /* ============================================================
     RENDER: RTL TABLE
     ============================================================ */
  function renderDocButton({ link, label, itemTitle, variant }) {
    if (!link?.trim()) {
      return `
        <span class="doc-btn doc-btn--disabled">
          ${ICON.alert}
          ${escapeHtml(label)}
        </span>`;
    }

    if (isExternalLink(link)) {
      return `
        <a class="doc-btn doc-btn--${variant} doc-btn--external"
           href="${escapeHtml(link)}"
           target="_blank"
           rel="noopener">
          ${ICON.link}
          ${escapeHtml(label)}
        </a>`;
    }

    return `
      <button type="button"
              class="doc-btn doc-btn--${variant}"
              data-preview
              data-file="${escapeHtml(link)}"
              data-label="${escapeHtml(label)}"
              data-context="${escapeHtml(itemTitle)}">
        ${variant === "produk" ? ICON.doc : ICON.eye}
        ${escapeHtml(label)}
      </button>`;
  }

  function renderItem(item) {
    const code = item.code?.trim()
      ? `<span class="rtl__item-code">${escapeHtml(item.code)}</span>`
      : "";

    const buktiBtn = renderDocButton({
      link: item.bukti,
      label: "Bukti",
      itemTitle: item.title,
      variant: "bukti",
    });

    const produkBtn = item.produk?.trim()
      ? renderDocButton({
          link: item.produk,
          label: "Produk",
          itemTitle: item.title,
          variant: "produk",
        })
      : "";

    return `
      <article class="rtl__item">
        <header class="rtl__item-head">
          ${code}
          <h3 class="rtl__item-title">${escapeHtml(item.title)}</h3>
        </header>
        <p class="rtl__item-desc">${escapeHtml(item.detail)}</p>

        <dl class="rtl__meta">
          <div class="rtl__meta-cell">
            <dt class="rtl__meta-label">Waktu Pelaksanaan</dt>
            <dd class="rtl__meta-value rtl__meta-value--muted">${escapeHtml(item.waktu)}</dd>
          </div>
          <div class="rtl__meta-cell">
            <dt class="rtl__meta-label">Sasaran</dt>
            <dd class="rtl__meta-value rtl__meta-value--muted">${escapeHtml(item.sasaran)}</dd>
          </div>
          <div class="rtl__meta-cell">
            <dt class="rtl__meta-label">Penanggung Jawab</dt>
            <dd class="rtl__meta-value">${escapeHtml(item.pj)}</dd>
          </div>
          <div class="rtl__meta-cell">
            <dt class="rtl__meta-label">Output / Outcome</dt>
            <dd class="rtl__meta-value">${escapeHtml(item.output)}</dd>
          </div>
        </dl>

        <div class="rtl__files">
          <span class="rtl__files-label">Dokumen:</span>
          ${buktiBtn}
          ${produkBtn}
        </div>
      </article>`;
  }

  function renderSection(section) {
    const items = section.items.map(renderItem).join("");
    return `
      <section class="rtl__section">
        <header class="rtl__section-head">
          <span class="rtl__section-num">${escapeHtml(section.number)}</span>
          <h2 class="rtl__section-title">${escapeHtml(section.title)}</h2>
        </header>
        ${items}
      </section>`;
  }

  function renderRtlTable(dataset) {
    $("#rtlBody").innerHTML = dataset.sections.map(renderSection).join("");
    $("#rtlTitle").textContent = `RTL — ${dataset.title}`;
    $("#rtlSubtitle").textContent =
      "Klik tombol Bukti atau Produk untuk melihat pratinjau, atau unduh langsung.";
  }

  /* ============================================================
     CACHE ELEMENTS
     ============================================================ */
  function cacheElements() {
    els.canvas = $("#pdfCanvas");
    els.ctx = els.canvas.getContext("2d");
    els.loading = $("#viewerLoading");
    els.error = $("#viewerError");
    els.pageCurrent = $("#pageCurrent");
    els.pageTotal = $("#pageTotal");
    els.prevBtn = $("#prevBtn");
    els.nextBtn = $("#nextBtn");
    els.fileName = $("#themeName");
    els.downloadBtn = $("#downloadBtn");
    els.fsBtn = $("#fsBtn");
    els.fsLabel = $("#fsLabel");
    els.fsIcon = $("#fsIcon");
    els.preview = $("#previewModal");
    els.previewTitle = $("#modalTitle");
    els.previewSub = $("#modalSubtitle");
    els.previewFrame = $("#modalFrame");
    els.previewLoading = $("#modalLoading");
    els.previewDownload = $("#modalDownload");
    els.previewOpen = $("#modalOpen");
  }

  /* ============================================================
     PDF VIEWER
     ============================================================ */
  async function loadPdf(url) {
    try {
      state.pdf = await pdfjsLib.getDocument(url).promise;
      els.loading.hidden = true;
      els.canvas.hidden = false;
      els.pageTotal.textContent = state.pdf.numPages;
      await renderPage(1);
      showUI();
    } catch (err) {
      console.error("PDF load failed:", err);
      els.loading.hidden = true;
      els.error.hidden = false;
      els.error.textContent = "Gagal memuat PDF. Pastikan file tersedia.";
    }
  }

  function computeViewport(page) {
    const base = page.getViewport({ scale: 1 });
    const isMobile = window.innerWidth < 700;
    const isFs = html.dataset.fullscreen === "true";

    const pad = isFs ? 0 : (isMobile ? 14 : 36);
    const headerH = isFs ? 0 : parseInt(getComputedStyle(html).getPropertyValue("--header-h"), 10);
    const tabsH = isFs ? 0 : parseInt(getComputedStyle(html).getPropertyValue("--tabs-h"), 10);

    const maxW = window.innerWidth - pad * 2;
    const maxH = window.innerHeight - pad * 2 - headerH - tabsH;
    const scale = Math.min(maxW / base.width, maxH / base.height);

    return page.getViewport({ scale });
  }

  async function renderPage(num) {
    if (!state.pdf) return;
    if (state.rendering) {
      state.pendingPage = num;
      return;
    }
    state.rendering = true;

    try {
      const page = await state.pdf.getPage(num);
      const viewport = computeViewport(page);
      const dpr = window.devicePixelRatio || 1;

      els.canvas.width = Math.floor(viewport.width * dpr);
      els.canvas.height = Math.floor(viewport.height * dpr);
      els.canvas.style.width = `${Math.floor(viewport.width)}px`;
      els.canvas.style.height = `${Math.floor(viewport.height)}px`;

      els.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      els.ctx.clearRect(0, 0, viewport.width, viewport.height);

      await page.render({ canvasContext: els.ctx, viewport }).promise;

      state.page = num;
      els.pageCurrent.textContent = num;
      els.prevBtn.disabled = num <= 1;
      els.nextBtn.disabled = num >= state.pdf.numPages;
    } catch (err) {
      console.error("Render failed:", err);
    }

    state.rendering = false;
    if (state.pendingPage !== null) {
      const next = state.pendingPage;
      state.pendingPage = null;
      renderPage(next);
    }
  }

  const goPrev = () => state.pdf && state.page > 1 && renderPage(state.page - 1);
  const goNext = () =>
    state.pdf && state.page < state.pdf.numPages && renderPage(state.page + 1);

  /* ============================================================
     UI AUTO-HIDE
     ============================================================ */
  function showUI() {
    if (state.tab !== "slide") return;
    if (els.preview.dataset.open === "true") return;
    html.dataset.ui = "visible";
    clearTimeout(state.hideTimer);
    const delay =
      html.dataset.fullscreen === "true" ? AUTOHIDE_DELAY_FS : AUTOHIDE_DELAY;
    state.hideTimer = setTimeout(hideUI, delay);
  }

  function hideUI() {
    if (state.tab !== "slide") return;
    if (els.preview.dataset.open === "true") return;
    html.dataset.ui = "hidden";
  }

  /* ============================================================
     FULLSCREEN
     ============================================================ */
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      const fn =
        html.requestFullscreen ||
        html.webkitRequestFullscreen ||
        html.msRequestFullscreen;
      fn?.call(html).catch((err) => console.warn("Fullscreen failed:", err));
    } else {
      const fn =
        document.exitFullscreen ||
        document.webkitExitFullscreen ||
        document.msExitFullscreen;
      fn?.call(document);
    }
  }

  function onFullscreenChange() {
    const isFs = Boolean(
      document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement
    );

    html.dataset.fullscreen = String(isFs);
    els.fsBtn.setAttribute("aria-pressed", String(isFs));

    if (isFs) {
      els.fsIcon.innerHTML = `<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>`;
      els.fsLabel.textContent = "Keluar";
      clearTimeout(state.hideTimer);
      state.hideTimer = setTimeout(hideUI, AUTOHIDE_DELAY_FS);
    } else {
      els.fsIcon.innerHTML = `<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>`;
      els.fsLabel.textContent = "Layar Penuh";
      html.dataset.ui = "visible";
      clearTimeout(state.hideTimer);
      state.hideTimer = setTimeout(hideUI, AUTOHIDE_DELAY);
    }

    setTimeout(() => state.pdf && renderPage(state.page), 120);
  }

  /* ============================================================
     PREVIEW MODAL
     ============================================================ */
  function openPreview(file, label, context, trigger) {
    state.lastFocused = trigger || document.activeElement;

    els.previewTitle.textContent = label || "Dokumen";
    els.previewSub.textContent = context || "";

    els.previewFrame.hidden = false;
    els.previewFrame.src = file;
    els.previewLoading.hidden = false;
    els.previewDownload.href = file;
    els.previewDownload.setAttribute("download", file.split("/").pop());
    els.previewOpen.href = file;

    const hideLoading = () => {
      els.previewLoading.hidden = true;
    };

    els.previewFrame.onload = () => setTimeout(hideLoading, 300);
    setTimeout(hideLoading, MODAL_LOAD_TIMEOUT);

    els.preview.dataset.open = "true";
    els.preview.setAttribute("aria-hidden", "false");
    $(".preview__close", els.preview)?.focus();
  }

  function closePreview() {
    if (els.preview.dataset.open !== "true") return;

    els.preview.dataset.open = "false";
    els.preview.setAttribute("aria-hidden", "true");

    setTimeout(() => {
      els.previewFrame.src = "";
      els.previewFrame.hidden = true;
    }, 250);

    state.lastFocused?.focus?.();
  }

  /* ============================================================
     TABS
     ============================================================ */
  function setTab(name) {
    state.tab = name;
    html.dataset.tab = name;

    $$(".tab").forEach((tab) =>
      tab.setAttribute("aria-selected", String(tab.dataset.tab === name))
    );

    $$(".panel").forEach((panel) =>
      (panel.dataset.active = String(panel.dataset.panel === name))
    );

    clearTimeout(state.hideTimer);
    html.dataset.ui = "visible";

    if (name === "slide") {
      state.hideTimer = setTimeout(hideUI, AUTOHIDE_DELAY);
      setTimeout(() => state.pdf && renderPage(state.page), 60);
    }
  }

  /* ============================================================
     EVENT WIRING
     ============================================================ */
  function wireEvents() {
    // Activity → show UI
    ["mousemove", "mousedown", "touchstart", "keydown", "scroll", "wheel"].forEach(
      (evt) => document.addEventListener(evt, showUI, { passive: true })
    );

    // Tabs
    $$(".tab").forEach((tab) =>
      tab.addEventListener("click", () => setTab(tab.dataset.tab))
    );

    // Fullscreen
    els.fsBtn.addEventListener("click", toggleFullscreen);
    ["fullscreenchange", "webkitfullscreenchange", "msfullscreenchange"].forEach(
      (evt) => document.addEventListener(evt, onFullscreenChange)
    );

    // PDF navigation
    els.prevBtn.addEventListener("click", goPrev);
    els.nextBtn.addEventListener("click", goNext);

    // Keyboard
    document.addEventListener("keydown", (e) => {
      if (els.preview.dataset.open === "true") {
        if (e.key === "Escape") closePreview();
        return;
      }
      if (state.tab !== "slide") return;

      switch (e.key) {
        case "ArrowLeft":
        case "PageUp":
          goPrev();
          break;
        case "ArrowRight":
        case "PageDown":
        case " ":
          e.preventDefault();
          goNext();
          break;
        case "f":
        case "F":
          toggleFullscreen();
          break;
      }
    });

    // Delegated click — preview + close
    document.addEventListener("click", (e) => {
      const trigger = e.target.closest("[data-preview]");
      if (trigger) {
        e.preventDefault();
        openPreview(
          trigger.dataset.file,
          trigger.dataset.label,
          trigger.dataset.context,
          trigger
        );
        return;
      }
      if (e.target.closest("[data-close]")) closePreview();
    });

    // Resize
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (state.pdf && state.tab === "slide") renderPage(state.page);
      }, 200);
    });

    // Swipe
    let touchX = 0;
    let touchY = 0;
    document.addEventListener(
      "touchstart",
      (e) => {
        if (state.tab !== "slide" || els.preview.dataset.open === "true") return;
        touchX = e.changedTouches[0].screenX;
        touchY = e.changedTouches[0].screenY;
      },
      { passive: true }
    );
    document.addEventListener(
      "touchend",
      (e) => {
        if (state.tab !== "slide" || els.preview.dataset.open === "true") return;
        const dx = e.changedTouches[0].screenX - touchX;
        const dy = e.changedTouches[0].screenY - touchY;
        if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
          dx < 0 ? goNext() : goPrev();
        }
      },
      { passive: true }
    );
  }

  /* ============================================================
     INIT
     ============================================================ */
  function init() {
    cacheElements();
    wireEvents();

    const dataset = resolveDataset();
    if (!dataset) {
      els.loading.hidden = true;
      els.error.hidden = false;
      els.error.textContent = "Data RTL tidak ditemukan.";
      return;
    }

    // Apply theme
    html.style.setProperty("--accent", dataset.accent);

    // Chrome
    els.fileName.textContent = dataset.title;
    els.downloadBtn.href = dataset.slide;
    els.downloadBtn.setAttribute("download", dataset.slide.split("/").pop());

    // Render
    renderRtlTable(dataset);
    loadPdf(dataset.slide);

    // Initial state
    html.dataset.tab = "slide";
    html.dataset.ui = "visible";
    showUI();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
